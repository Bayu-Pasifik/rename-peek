name: Release (build + sign)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Signing aktif hanya jika variabel repo SIGNPATH_ORGANIZATION_ID sudah diisi (setelah SignPath menyetujui).
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pasang Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      # --- Tahap 1: tanda tangani rename_peek.exe ---
      - name: Unggah build mentah
        if: env.SIGN == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: build/windows/x64/runner/Release/*

      - name: Tanda tangani aplikasi (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rename-peek
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Timpa exe dengan versi bertanda tangan
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-app\rename_peek.exe build\windows\x64\runner\Release\rename_peek.exe -Force

      # --- Tahap 2: bangun installer dari rilis (bertanda tangan) lalu tanda tangani installer ---
      - name: Bangun installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build_installer.ps1 -SkipBuild

      - name: Unggah installer mentah
        if: env.SIGN == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: build/installer/RenamePeek-Setup-*.exe

      - name: Tanda tangani installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rename-peek
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      # --- Paket rilis ---
      - name: Kumpulkan aset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $installer = if ($env:SIGN -eq 'true') { "signed-installer\RenamePeek-Setup-$ver.exe" } else { "build\installer\RenamePeek-Setup-$ver.exe" }
          Copy-Item $installer dist\
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\RenamePeek-$ver-portable.zip"
          Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Lampirkan ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist\*).FullName --clobber
